name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7
      - name: Compilar debug
        run: gradle assembleDebug --no-daemon -PverCode=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publicar release (o app confere esta release para se atualizar)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk app-debug.apk
          gh release create "build-${{ github.run_number }}" app-debug.apk \
            --title "Build ${{ github.run_number }}" --notes "APK automático" --latest
